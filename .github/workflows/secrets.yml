name: Secret scan
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  scan:
    name: Redacted repository history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject tracked local credentials and private artifacts
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess

          names = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          private_dirs = {".local", ".secrets", "credentials", "private-data", "uploads", "artifacts", ".codex", ".agents"}
          blocked = []
          for name in filter(None, names):
              path = pathlib.PurePosixPath(name)
              if ((path.name == ".env" or path.name.startswith(".env.")) and path.name != ".env.example"
                      or path.name in {".npmrc", ".pgpass"}
                      or path.suffix.lower() in {".pem", ".key", ".p12", ".pfx", ".env", ".jks", ".keystore", ".dump"}
                      or path.name.endswith(".sql.gz")
                      or private_dirs.intersection(path.parts[:-1])):
                  blocked.append(name)
          if blocked:
              raise SystemExit("Tracked private configuration/artifacts are forbidden; inspect the staged file list locally.")
          print("Tracked file boundary passed.")
          PY
      - name: Install checksum-pinned Gitleaks
        # Official release and checksum verified 2026-09-27:
        # https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1
        # https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
        run: |
          scanner_dir="${RUNNER_TEMP}/payvigil-gitleaks"
          mkdir -p "$scanner_dir"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$scanner_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
      - name: Scan committed history without exposing detected values
        run: |
          "${RUNNER_TEMP}/payvigil-gitleaks/gitleaks" git \
            --log-opts='--all' --redact=100 --no-banner --no-color --timeout=300 .
