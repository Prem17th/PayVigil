name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  checks:
    name: Application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Official postgres:17 multi-platform digest, verified 2026-09-27.
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          # Ephemeral runner-only test cluster, never used by a deployment.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:54329:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python -m pip check
      - name: Install frontend lockfile
        working-directory: frontend
        run: npm ci
      - name: Check Python formatting and basic correctness
        run: |
          python -m ruff format --check .
          python -m ruff check .
      - name: Verify migrations, tenant controls, provider contracts and builds
        env:
          LOCAL_TEST_ADMIN_URL: postgresql://postgres@127.0.0.1:54329/postgres?sslmode=disable
        run: python scripts/check.py --postgres
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: local-build-evidence
          path: artifacts/build-checks.json
          if-no-files-found: error
          retention-days: 14
